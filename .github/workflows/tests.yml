name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # !cancelled() so one push surfaces every problem rather than only the
      # first step to fail: a formatting nit should not hide a test failure.
      - name: Format
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Run tests
        if: ${{ !cancelled() }}
        run: pytest -v

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # uv.lock records the project's own version, so a release that bumps
      # pyproject.toml without re-locking leaves `uv sync --locked` broken on
      # main. This catches that standing rather than at the next contributor.
      - name: uv.lock is in step with pyproject.toml
        run: uv lock --check
