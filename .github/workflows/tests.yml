name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # uv.lock records the project's own version, so a release that bumps
      # pyproject.toml without re-locking leaves `uv sync --locked` broken on
      # main. Catch that standing rather than at the next contributor.
      - name: uv.lock is in step with pyproject.toml
        run: uv lock --check

      - name: Install
        run: uv sync --locked --extra dev

      # Linting runs through the lockfile on purpose. Installing `ruff>=0.1.0`
      # from pyproject would resolve to whatever released most recently, so a new
      # ruff adding a rule turns every open PR red without anyone changing code -
      # measured here: the locked 0.11.11 reports no errors on this tree while
      # the current release reports 6 (UP042). Pinned, a ruff bump arrives as a
      # lockfile change someone reviews and fixes deliberately.
      - name: Lint
        run: uv run ruff check .

      # !cancelled() so one push surfaces every problem rather than only the
      # first step to fail: a formatting nit should not hide a lint error.
      - name: Format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
